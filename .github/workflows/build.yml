name: C/C++ CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.github/**'

  pull_request:
    types: [opened, reopened, synchronize]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  windows:
    name: 'Windows'
    runs-on: windows-2025

    env:
      solution: 'msvc/ReGameDLL.sln'
      buildPlatform: 'Win32'
      buildRelease: 'Release'
      buildReleasePlay: 'Release Play'
      buildTests: 'Tests'

    steps:
      - name: Configure
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

# TODO: add support of 141_xp toolchain at VS2022+
#      - name: Install v140, v141 and v142 toolsets
#        shell: cmd
#        run: |
#          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify ^
#          --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" ^
#          --add Microsoft.VisualStudio.Component.WindowsXP ^
#          --add Microsoft.VisualStudio.Component.VC.v140 ^
#          --add Microsoft.VisualStudio.Component.VC.v140.x86.x64 ^
#          --add Microsoft.VisualStudio.Component.VC.v140.xp ^
#          --add Microsoft.VisualStudio.Component.VC.140.CRT ^
#          --add Microsoft.VisualStudio.Component.VC.v141 ^
#          --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 ^
#          --add Microsoft.VisualStudio.Component.VC.v141.xp ^
#          --add Microsoft.VisualStudio.Component.VC.v142 ^
#          --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 ^
#          --quiet --norestart

      - name: Select PlatformToolset
        id: select_toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs2019 = & $vswhere -products * -version "[16.0,17.0)" -property installationPath -latest
          $vs2022 = & $vswhere -products * -version "[17.0,)" -property installationPath -latest

          if ($vs2019) {
            "toolset=v140_xp" >> $env:GITHUB_OUTPUT
            Write-Host "Selected v140_xp toolset"
          } elseif ($vs2022) {
            "toolset=v143" >> $env:GITHUB_OUTPUT
            Write-Host "Selected v143 toolset"
          } else {
            Write-Error "No suitable Visual Studio installation found"
            exit 1
          }

      - name: Build and Run unittests
        run: |
          $toolset = '${{ steps.select_toolset.outputs.toolset }}'
          msbuild ${{ env.solution }} -p:Configuration="${{ env.buildTests }}" /t:Clean,Build /p:Platform=${{ env.buildPlatform }} /p:PlatformToolset=$toolset /p:XPDeprecationWarning=false
          .\"msvc\Tests\mp.exe"
          If ($LASTEXITCODE -ne 0 -And
          $LASTEXITCODE -ne 3)
          {[Environment]::Exit(1)}
        shell: "pwsh"

      - name: Build
        run: |
          $toolset = '${{ steps.select_toolset.outputs.toolset }}'
          msbuild ${{ env.solution }} -p:Configuration="${{ env.buildRelease }}" /t:Clean,Build /p:Platform=${{ env.buildPlatform }} /p:PlatformToolset=$toolset /p:XPDeprecationWarning=false
          msbuild ${{ env.solution }} -p:Configuration="${{ env.buildReleasePlay }}" /t:Clean,Build /p:Platform=${{ env.buildPlatform }} /p:PlatformToolset=$toolset /p:XPDeprecationWarning=false
      - name: Get rcedit from chocolatey
        shell: pwsh
        run: |
          choco install rcedit -y

      - name: Move files
        run: |
          mkdir publish\debug
          mkdir publish\tests
          mkdir publish\bin\win32\cstrike\dlls
          move "msvc\${{ env.buildReleasePlay }}\mp.dll" publish\tests\mp.dll
          move msvc\${{ env.buildRelease }}\mp.dll publish\bin\win32\cstrike\dlls\mp.dll
          move msvc\${{ env.buildRelease }}\mp.pdb publish\debug\mp.pdb

      - name: Get app version
        id: get_version
        shell: pwsh
        run: |
          $versionFile = "regamedll/version/appversion.h"
          if (-not (Test-Path $versionFile)) {
            Write-Error "Version file not found: $versionFile"
            exit 1
          }

          $content = Get-Content $versionFile
          foreach ($line in $content) {
            if ($line -match '^\s*#define\s+APP_VERSION\s+"([^"]+)"') {
              $version = $matches[1]
              "version=$version" >> $env:GITHUB_OUTPUT
              Write-Host "Found version: $version"
              exit 0
            }
          }
          Write-Error "APP_VERSION not found in file"
          exit 1

      - name: Show version
        run: echo "Version is ${{ steps.get_version.outputs.version }}"

      - name: Edit resources at windows binaries
        run: |
          rcedit ${{ github.workspace }}\publish\bin\win32\cstrike\dlls\mp.dll --set-version-string ProductName "Regamedll_CS - mp.dll" --set-file-version "${{ steps.get_version.outputs.version }}" --set-product-version "${{ steps.get_version.outputs.version }}" --set-version-string FileDescription "Regamedll_CS (mp.dll) - provide more stable (than official) version of Counter-Strike game with extended API for mods and plugins, Commit: $env:GITHUB_SHA" --set-version-string "Comments" "Regamedll_CS is a result of reverse engineering of original library mod HLDS (build 6153beta) using DWARF debug info embedded into linux version of HLDS, cs.so. Commit: $env:GITHUB_SHA" --set-version-string CompanyName "ReHLDS Dev Team" --set-version-string LegalCopyright "Copyright 2025 Valve, ReHLDS DevTeam" --set-icon regamedll/msvc/icon.ico
        shell: "pwsh"

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win32
          path: publish/*

  testdemos:
    name: 'Test demos'
    runs-on: ubuntu-latest
    container: rehldsorg/testdemos:latest
    needs: [windows]

    defaults:
      run:
        shell: bash
        working-directory: /opt/HLDS

    strategy:
      fail-fast: false
      matrix:
        test: [
          { file: 'cstrike-basic-1',    desc: 'CS: Testing jumping, scenarios, shooting etc' },
        ]

    steps:
      - name: Deploying windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win32

      - name: Setup dependencies
        run: |
          chown root ~
          rsync -a deps/regamedll/* .
          mv $GITHUB_WORKSPACE/tests/mp.dll cstrike/dlls/mp.dll

      - name: Play test
        env:
          demo: ${{ matrix.test.file }}
          desc: ${{ matrix.test.desc }}
        run: ./runTest.sh

  linux:
    name: 'Linux'
    runs-on: ubuntu-latest
    container: debian:11-slim

    steps:
      - name: Install dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y \
            gcc-multilib g++-multilib \
            build-essential \
            libc6-dev libc6-dev-i386 \
            git cmake rsync \
            g++ gcc \
            libarchive-zip-perl

      - name: Configure
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: GPG Import
        continue-on-error: true
        run: |
          # Check if GPG secrets are available
          if [[ -z "${{ secrets.PUB_ASC }}" ]] || [[ -z "${{ secrets.KEY_ASC }}" ]]; then
            echo "Warning: GPG secrets not configured. Skipping GPG key import."
            echo "To enable GPG signing, add PUB_ASC and KEY_ASC secrets in repository settings."
            exit 0
          fi

          echo "${{ secrets.PUB_ASC }}" > pub.asc
          echo "${{ secrets.KEY_ASC }}" > key.asc

          # Import the public key
          gpg --batch --yes --import pub.asc
          if [[ $? -ne 0 ]]; then
            echo "Error: Failed to import the public key"
            exit 1
          fi

          # Import the private key
          gpg --batch --yes --import key.asc
          if [[ $? -ne 0 ]]; then
            echo "Error: Failed to import the private key"
            exit 2
          fi

          # Extract the fingerprint of the imported public key
          GPG_LINUX_FINGERPRINT=$(gpg --list-keys --with-colons | grep '^fpr' | head -n 1 | cut -d: -f10)

          # Check if the fingerprint was extracted
          if [[ -z "$GPG_LINUX_FINGERPRINT" ]]; then
            echo "Error: Failed to extract the fingerprint of the key"
            exit 3
          fi

          # Set the trust level for the key
          echo "$GPG_LINUX_FINGERPRINT:6:" | gpg --batch --import-ownertrust
          if [ $? -ne 0 ]; then
            echo "Error: Failed to set trust for the key $GPG_LINUX_FINGERPRINT"
            exit 4
          fi

          echo "Key $GPG_LINUX_FINGERPRINT successfully imported and trusted"
          gpg --list-keys

          #export for global use
          echo "GPG_LINUX_FINGERPRINT=$GPG_LINUX_FINGERPRINT" >> $GITHUB_ENV
        shell: bash
        if: github.event_name != 'pull_request'

      - name: Build and Run unittests
        run: |
          rm -rf build && CC=gcc CXX=g++ cmake -DCMAKE_BUILD_TYPE=Unittests -B build && cmake --build build -j8
          retVal=0
          ./build/regamedll/cs 2> /dev/null > result.log || retVal=$?
          while read line; do
            if [[ ${line} == *"Warning in test"* ]] ; then
              echo -e "\e[2;38m$line"
            elif [[ ${line} == *"Failure in test"* ]] ; then
              echo -e "\e[1;31m$line"
            else
              echo -e "\e[0;33m$line"
            fi
          done <<< $(cat result.log)

          if [ $retVal -ne 0 ] && [ $retVal -ne 3 ]; then
            echo -e "\e[30;41mExit code: $retVal\e[0m"
            exit 1 # Unittest failed
          else
            echo -e "\e[30;43mExit code: $retVal\e[0m"
          fi
        shell: bash

      - name: Build using GCC Compiler
        run: |
          rm -rf build && CC=gcc CXX=g++ cmake -B build && cmake --build build -j8

      - name: Prepare CSSDK
        run: |
          mkdir -p publish/cssdk
          rsync -a regamedll/extra/cssdk/ publish/cssdk/ --exclude=.git --exclude=LICENSE --exclude=README.md

      - name: Move files
        run: |
          mkdir -p publish/bin/linux32/cstrike/dlls
          mv build/regamedll/cs.so publish/bin/linux32/cstrike/dlls/cs.so 2>/dev/null || true
          mv regamedll/version/appversion.h publish/appversion.h
          mv dist/ publish/

      - name: Compute and bundle server CRC
        shell: bash
        run: |
          cd publish/bin/linux32/cstrike/dlls
          CRC=$(crc32 cs.so | tr '[:lower:]' '[:upper:]')
          echo "$CRC  cs.so" > cs.so.crc
          echo "Bundled server CRC: $CRC"

      - name: Run GLIBC/ABI version compat test
        run: |
          binaries=(
            "publish/bin/linux32/cstrike/dlls/cs.so"
          )
          bash ./regamedll/version/glibc_test.sh ${binaries[@]}
          if [[ $? -ne 0 ]]; then
            exit 1 # Assertion failed
          fi
        shell: bash

      - name: Deploy artifacts
        uses: actions/upload-artifact@v4
        id: upload-job
        with:
          name: linux32
          path: publish/*

  update-amxmodx-crc:
    name: 'Update AMX MOD X CRC'
    runs-on: ubuntu-latest
    needs: [linux]
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux32
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-zip-perl jq
      
      - name: Calculate CRC32 checksum
        id: crc
        run: |
          if [ ! -f "bin/linux32/cstrike/dlls/cs.so" ]; then
            echo "Error: cs.so not found!"
            exit 1
          fi
          
          # Calculate CRC32
          CRC32=$(crc32 bin/linux32/cstrike/dlls/cs.so)
          echo "CRC32 checksum: $CRC32"
          
          # Convert to uppercase hex format
          CRC32_HEX=$(echo "$CRC32" | tr '[:lower:]' '[:upper:]')
          echo "crc32_hex=$CRC32_HEX" >> $GITHUB_OUTPUT
          echo "CRC32 HEX: $CRC32_HEX"
          
          # Display file info
          ls -lh bin/linux32/cstrike/dlls/cs.so
      
      - name: Checkout AMX MOD X fork
        uses: actions/checkout@v4
        with:
          repository: mrc4tt/amxmodx
          token: ${{ secrets.AMXMODX_PAT }}
          path: amxmodx-repo
      
      - name: Update game.cstrike.txt with new CRC
        id: update
        run: |
          cd amxmodx-repo
          FILE="gamedata/modules.games/game.cstrike.txt"
          CRC32_HEX="${{ steps.crc.outputs.crc32_hex }}"

          if [ ! -f "$FILE" ]; then
            echo "Error: $FILE not found in AMX MOD X repo!"
            exit 1
          fi

          echo "Original file content (CRC section):"
          sed -n '/"CRC"/,/"Signatures"/p' "$FILE" | head -40

          cp "$FILE" "$FILE.bak"

          python3 - <<'PYCODE'
          import re, pathlib

          path = pathlib.Path("gamedata/modules.games/game.cstrike.txt")
          text = path.read_text()
          crc = "${{ steps.crc.outputs.crc32_hex }}"

          # Brace-balanced scan: find the top-level "CRC" block.
          crc_header = re.search(r'"CRC"\s*\{', text)
          if not crc_header:
              raise SystemExit("CRC block not found")

          def scan_block_end(s, start):
              depth = 1
              i = start
              while i < len(s) and depth > 0:
                  c = s[i]
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise SystemExit("Unbalanced braces")

          crc_body_start = crc_header.end()
          crc_body_end = scan_block_end(text, crc_body_start)
          crc_block_body = text[crc_body_start:crc_body_end]

          # Indent for child blocks: indent of CRC's closing brace + one tab.
          line_start = text.rfind('\n', 0, crc_body_end) + 1
          crc_indent = re.match(r'[ \t]*', text[line_start:crc_body_end]).group(0)
          indent = crc_indent + "\t"
          inner_indent = indent + "\t"

          # Strip ALL existing "server" sub-blocks under CRC. Repeated runs of
          # the old script could stack/leave stale entries; this normalizes.
          def strip_server_blocks(s):
              out = []
              j = 0
              pat = re.compile(r'^[ \t]*"server"\s*\{', re.M)
              while True:
                  m = pat.search(s, j)
                  if not m:
                      out.append(s[j:])
                      break
                  out.append(s[j:m.start()])
                  k = scan_block_end(s, m.end()) + 1
                  while k < len(s) and s[k] in ' \t':
                      k += 1
                  if k < len(s) and s[k] == '\n':
                      k += 1
                  j = k
              return ''.join(out)

          cleaned = strip_server_blocks(crc_block_body)
          # Remove orphan AUTO-GENERATED marker lines from previous runs.
          cleaned = re.sub(
              r'^[ \t]*//\s*AUTO-GENERATED by ReGameDLL_CS CI[^\n]*\n',
              '',
              cleaned,
              flags=re.M,
          )

          # Build a single fresh server block. Marker comment warns humans;
          # ReGameDLL_CS CI overwrites this on every build.
          server_block = (
              f'{indent}// AUTO-GENERATED by ReGameDLL_CS CI - DO NOT EDIT MANUALLY\n'
              f'{indent}"server"\n'
              f'{indent}{{\n'
              f'{inner_indent}"linux" "{crc}" // cstrike/dlls/cs.so\n'
              f'{indent}}}\n'
          )

          # Insert after the engine sub-block if present, otherwise at end of
          # CRC body.
          engine_match = re.search(r'^[ \t]*"engine"\s*\{', cleaned, re.M)
          if engine_match:
              engine_end = scan_block_end(cleaned, engine_match.end()) + 1
              # Skip trailing whitespace/newline after engine block
              k = engine_end
              while k < len(cleaned) and cleaned[k] in ' \t':
                  k += 1
              if k < len(cleaned) and cleaned[k] == '\n':
                  k += 1
              new_body = cleaned[:k] + '\n' + server_block + cleaned[k:]
          else:
              prefix = '' if cleaned.startswith('\n') else '\n'
              new_body = prefix + server_block + cleaned.lstrip('\n')

          # Collapse runs of blank lines.
          new_body = re.sub(r'\n{3,}', '\n\n', new_body)

          new_text = text[:crc_body_start] + new_body + text[crc_body_end:]
          path.write_text(new_text)
          print("Server CRC normalized: stripped prior server blocks, inserted fresh one")
          PYCODE

          echo ""
          echo "Updated file content (CRC section):"
          sed -n '/"CRC"/,/"Signatures"/p' "$FILE" | head -40

          if diff "$FILE.bak" "$FILE" > /dev/null; then
            echo "No changes detected in $FILE"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "File successfully updated!"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

          rm "$FILE.bak"

      - name: Commit and push changes to AMX MOD X
        if: steps.update.outputs.changed == 'true'
        run: |
          cd amxmodx-repo

          git config user.name "ReGameDLL_CS Build Bot"
          git config user.email "actions@github.com"

          git add gamedata/modules.games/game.cstrike.txt

          BUILD_NR="${{ github.run_number }}"
          CRC32_HEX="${{ steps.crc.outputs.crc32_hex }}"
          REGAMEDLL_SHA="${{ github.sha }}"

          git commit -m "chore: Update server CRC from ReGameDLL_CS build ${BUILD_NR} - Server: ${CRC32_HEX}

          Source: ReGameDLL_CS ${REGAMEDLL_SHA}
          Auto-generated by .github/workflows/build.yml. Do not hand-edit
          the \"server\" CRC block in game.cstrike.txt - it is overwritten
          on every ReGameDLL_CS master build."
          git push

      - name: Verify pushed CRC is live on amxmodx default branch
        if: steps.update.outputs.changed == 'true'
        run: |
          cd amxmodx-repo
          CRC32_HEX="${{ steps.crc.outputs.crc32_hex }}"
          git fetch origin
          DEFAULT_BRANCH=$(git remote show origin | sed -n 's|.*HEAD branch: ||p')
          REMOTE_CRC=$(git show "origin/${DEFAULT_BRANCH}:gamedata/modules.games/game.cstrike.txt" \
            | python3 -c "
          import re, sys
          text = sys.stdin.read()
          # Find the server sub-block under top-level CRC and extract its linux entry.
          crc = re.search(r'\"CRC\"\s*\{', text)
          if not crc:
              print('NONE'); raise SystemExit
          depth = 1; i = crc.end()
          while i < len(text) and depth > 0:
              if text[i] == '{': depth += 1
              elif text[i] == '}':
                  depth -= 1
                  if depth == 0: break
              i += 1
          body = text[crc.end():i]
          srv = re.search(r'\"server\"\s*\{([^}]*)\}', body)
          if not srv:
              print('NONE'); raise SystemExit
          m = re.search(r'\"linux\"\s*\"([0-9A-Fa-f]+)\"', srv.group(1))
          print(m.group(1).upper() if m else 'NONE')
          ")
          echo "Local CRC32:  ${CRC32_HEX}"
          echo "Remote CRC32: ${REMOTE_CRC}"
          if [ "${REMOTE_CRC}" != "${CRC32_HEX}" ]; then
            echo "::error::amxmodx ${DEFAULT_BRANCH} server CRC (${REMOTE_CRC}) does not match this build's CRC (${CRC32_HEX}) after push. A concurrent commit may have reverted the auto-update."
            exit 1
          fi
          echo "Verified: amxmodx ${DEFAULT_BRANCH} carries server CRC ${CRC32_HEX}."

      - name: Build Summary
        if: always()
        run: |
          echo "## AMX MOD X CRC Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CRC32 Checksum:** ${{ steps.crc.outputs.crc32_hex }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.update.outputs.changed }}" = "true" ]; then
            echo "- **AMX MOD X Updated:** ✅ Yes" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **AMX MOD X Updated:** ⏭️ No changes needed" >> $GITHUB_STEP_SUMMARY
          fi

  publish:
    name: 'Publish'
    runs-on: ubuntu-latest
    needs: [windows, testdemos, linux]

    steps:
      - name: Deploying linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux32

      - name: Deploying windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win32

      - name: Reading appversion.h
        run: |
          if [ -e appversion.h ]; then
            APP_VERSION=$(cat appversion.h | grep -wi '#define APP_VERSION_STRD' | sed -e 's/#define APP_VERSION_STRD[ \t\r\n\v\f]\+\(.*\)/\1/i' -e 's/\r//g')
            if [ $? -ne 0 ]; then
              APP_VERSION=""
            else
              # Remove quotes
              APP_VERSION=$(echo $APP_VERSION | xargs)
              echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
            fi
          fi
          rm -f appversion.h

      - name: Packaging binaries
        id: packaging-job
        if: |
          github.event_name == 'release' &&
          github.event.action == 'published' &&
          startsWith(github.ref, 'refs/tags/')
        run: |
          rsync -a dist/ bin/win32/cstrike
          rsync -a dist/ bin/linux32/cstrike

          # new runner, niw signs
          echo "${{ secrets.PUB_ASC }}" > "${{ secrets.PUB_ASC_FILE }}"
          echo "${{ secrets.KEY_ASC }}" > "${{ secrets.KEY_ASC_FILE }}"
          gpg --batch --yes --import "${{ secrets.PUB_ASC_FILE }}"
          gpg --batch --yes --import "${{ secrets.KEY_ASC_FILE }}"
          GPG_LINUX_FINGERPRINT=$(gpg --list-keys --with-colons | grep '^fpr' | head -n 1 | cut -d: -f10)
          echo "$GPG_LINUX_FINGERPRINT:6:" | gpg --batch --import-ownertrust
          echo "GPG_LINUX_FINGERPRINT=$GPG_LINUX_FINGERPRINT" >> $GITHUB_ENV

          sign_file() {
            local file=$1
            gpg --batch --yes --detach-sign --armor -u "$GPG_LINUX_FINGERPRINT" "$file"
            if [ $? -ne 0 ]; then
              echo "Error: Failed to sign $file"
              exit 2
            fi
            echo "$file signed successfully."
          }

          # Pack and sign final archive
          7z a -tzip regamedll-bin-${{ env.APP_VERSION }}.zip bin/ cssdk/
          sign_file "regamedll-bin-${{ env.APP_VERSION }}.zip"

      - name: Publish artifacts
        uses: softprops/action-gh-release@v2
        id: publish-job
        if: |
          startsWith(github.ref, 'refs/tags/') &&
          steps.packaging-job.outcome == 'success'
        with:
          files: |
            *.zip
            *.7z
            *.asc
        env:
          GITHUB_TOKEN: ${{ secrets.API_TOKEN }}

